<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preventive Maintenance · NEMSU ICT Services</title>
  <link rel="icon" href="nemsu-logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.__pageInit = function () {
      const session = Auth.requireAuth();
      if (!session) return;
      document.getElementById('app').innerHTML =
        buildShell(session, '/maintenance.html') + `
        <div class="fade-in" style="display:flex;flex-direction:column;gap:1.5rem;">
          <div>
            <h2 class="page-title">Preventive Maintenance</h2>
            <p class="page-subtitle">FM-OICT-015 Preventive Maintenance Checklist</p>
          </div>
          <div class="card" style="padding:3rem;text-align:center;">
            <div class="placeholder-icon">${ICONS.wrench}</div>
            <p style="font-weight:700;font-size:1rem;">PM checklist coming next</p>
            <p style="font-size:.875rem;color:var(--muted-foreground);margin-top:.4rem;max-width:380px;margin-inline:auto;">
              The FM-OICT-015 preventive maintenance checklist module will be built in the next iteration.
            </p>
          </div>
        </div>` + closeShell();
    };
  </script>
</body>
</html>
